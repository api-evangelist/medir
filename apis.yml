name: Medir
description: >-
  Medir is a South Korean digital-health company behind Medb (메듭), a
  non-face-to-face (telemedicine) and prescription-drug delivery platform that
  connects patients, doctors, hospitals and pharmacies. Through the Medb mobile
  app, patients receive 100% video consultations with physicians and have their
  prescribed medications delivered to their door — often within roughly 30
  minutes to two hours — with no separate service fee beyond the standard
  consultation charge. Medir is a portfolio company backed by 500 Global. The
  business operates as a consumer mobile application (iOS and Android) and does
  not currently publish a public developer API; this profile tracks the company
  in the API Evangelist network pending any future API surface.
